[project]
name = "scar"
version = "1.0.0"
description = "SCAR - Systemic Cognitive Autonomous Responder: a general-purpose AI computer operator for Windows 11"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    # runtime core
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "httpx>=0.28,<0.29",
    "typer>=0.27,<0.28",
    "rich>=15,<16",
    "prompt-toolkit>=3.0.53,<3.1",
    "structlog>=26.1,<27",
    "platformdirs>=4.12,<5",
    "pyyaml>=6.0.3,<7",
    "tzdata>=2026.4",
    "dateparser>=1.4,<2",
    "psutil>=7.2,<8",
    "numpy>=2.2,<3",
    "pillow>=12,<13",
    "keyring>=25.7,<26",
    "watchdog>=6,<7",
    # windows
    "pywin32>=312; sys_platform == 'win32'",
    "comtypes>=1.4.17,<2; sys_platform == 'win32'",
    "uiautomation>=2.0.29,<3; sys_platform == 'win32'",
    "nvidia-ml-py>=13.615",
    "send2trash>=2.1,<3",
    "pynput>=1.8.2,<2",
    "mss>=10.2,<11",
    "pyperclip>=1.11,<2",
    "winrt-runtime>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2.1,<4; sys_platform == 'win32'",
    "windows-toasts>=1.3.1,<2; sys_platform == 'win32'",
    # browser + web
    "playwright>=1.63,<2",
    "trafilatura>=2.2,<3",
    "ddgs>=9.16,<10",
    # documents
    "pypdf>=6.19,<7",
    "python-docx>=1.2,<2",
    "fpdf2>=2.8.8,<3",
    # memory / retrieval
    "faiss-cpu>=1.15,<2",
    "fastembed>=0.8.1,<0.9",
    # voice
    "sounddevice>=0.5.6,<0.6",
    "onnxruntime>=1.22,<2",
    "faster-whisper>=1.2.1,<2",
    "openwakeword>=0.6,<0.7",
    "edge-tts>=7.2.8,<8",
    # messaging (MTProto user client, MIT)
    "telethon>=1.45,<2",
]

[project.optional-dependencies]
# Kokoro pulls GPL phonemizer components; kept optional per ADR-0007.
kokoro = ["kokoro-onnx>=0.6.1,<0.7"]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-timeout>=2.4,<3",
    "hypothesis>=6.168,<7",
    "respx>=0.23,<0.24",
    "ruff>=0.16,<0.17",
    "pyright>=1.1.414",
    "pip-audit>=2.10,<3",
]

[project.scripts]
scar = "scar.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scar"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "S110", "PIE", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "SIM105", "B008", "UP040", "UP046", "UP047", "ASYNC109", "ASYNC230", "ASYNC240", "ASYNC251", "RUF006"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "B", "RUF"]

[tool.pyright]
include = ["src/scar/core", "src/scar/security", "src/scar/agent", "src/scar/tools/base.py"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false
reportUnknownLambdaType = false
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = [
    "windows: requires a Windows host",
    "live: performs real actions on the desktop; needs SCAR_LIVE_TESTS=1",
    "network: needs internet access",
    "gpu: needs an NVIDIA GPU",
    "audio: needs audio devices",
    "credentials: needs provider credentials",
]
filterwarnings = ["ignore::DeprecationWarning:pywintypes"]
