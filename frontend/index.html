<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="desktop-transparent theme-dark">
  <div id="canvas-container"></div>

  <div id="toast" class="toast">Jarvis</div>

  <!-- Settings dock (top right, collapsed by default) -->
  <aside id="aside-column" class="aside-dock collapsed">
    <div id="aside-toggle-btn" class="aside-trigger" title="Click to expand/collapse controls">
      <div class="aside-pulse-dot"></div>
      <span class="aside-title-text">🤖 JARVIS</span>
      <span class="aside-toggle-chevron">▼</span>
    </div>
    <div class="aside-content">
      <div class="aside-section">
        <div class="control-label-row">
          <span>Robot size</span>
          <span id="scale-val">1.00x</span>
        </div>
        <input id="scale-slider" type="range" min="0.6" max="1.6" step="0.05" value="1">
      </div>
      <button id="theme-toggle-btn" class="dock-btn" style="width: 100%;">🌓 Toggle dark / light</button>
      <button id="audio-toggle-btn" class="dock-btn" style="width: 100%;">🔊 Effects: ON</button>
      <button id="btn-trigger-wellness" class="dock-btn" style="width: 100%;">💧 Take a break reminder</button>
      <button id="roam-toggle-btn" class="dock-btn primary" style="width: 100%;">🌐 Roam: ON</button>
    </div>
  </aside>

  <!-- Right-click the robot -->
  <div id="character-context-menu" class="context-menu">
    <div class="menu-header">
      <span>🤖 JARVIS</span>
      <button id="menu-close-btn" class="menu-close-x">✕</button>
    </div>

    <input id="ctx-command" class="ctx-command" type="text" placeholder="Type a command…  (Enter)" autocomplete="off" spellcheck="false">

    <div class="menu-group-label">Mood</div>
    <div class="menu-mood-grid">
      <button class="mood-btn" data-mood="happy">😊 Happy</button>
      <button class="mood-btn" data-mood="scared">😱 Scared</button>
      <button class="mood-btn" data-mood="angry">😠 Angry</button>
      <button class="mood-btn" data-mood="sad">😢 Sad</button>
      <button class="mood-btn" data-mood="curious">🤔 Curious</button>
      <button class="mood-btn" data-mood="normal">🤖 Normal</button>
    </div>

    <div class="menu-divider"></div>
    <button id="ctx-sleep-btn" class="ctx-item">😴 Go to sleep</button>
    <button id="ctx-rest-btn" class="ctx-item">💧 Break reminder</button>
    <div class="menu-divider"></div>
    <button id="ctx-quit-btn" class="ctx-item danger">✕ Quit Jarvis</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
